name: Ozzie
options:
  bundleIdPrefix: com.ozzie
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.ozzie.wizard
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    INFOPLIST_FILE: Sources/Info.plist
    CODE_SIGN_ENTITLEMENTS: Sources/Ozzie.entitlements
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Ozzie:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: Ozzie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    info:
      path: Sources/Info.plist
    entitlements:
      path: Sources/Ozzie.entitlements
